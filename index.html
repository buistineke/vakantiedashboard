<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadtrip 2026 — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lustria&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1b22;
    --muted:#8a6470;
    --faint:#ab8f8d;
    --bg:#faf1e4;
    --card:#fffbf6;
    --line:#f0e0d2;
    --terracotta:#e2703f;
    --terracotta-soft:#fbe3d3;
    --terracotta-dark:#b6491c;
    --mauve:#8b4f63;
    --mauve-soft:#f7e6e1;
    --coral:#d9553a;
    --sun:#e4a24a;
    --shadow: 0 1px 2px rgba(43,27,34,0.05), 0 8px 24px -12px rgba(43,27,34,0.12);
    --shadow-hover: 0 4px 8px rgba(43,27,34,0.07), 0 16px 32px -12px rgba(226,112,63,0.20);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1, .place-name{
    font-family:'Lustria',Georgia,serif;
  }

  /* Hero */
  .hero{
    position:relative;
    padding:44px 20px 64px;
    overflow:hidden;
    background:
      radial-gradient(600px 300px at 15% -10%, rgba(226,112,63,0.22), transparent 60%),
      radial-gradient(500px 260px at 100% 0%, rgba(139,79,99,0.16), transparent 60%),
      var(--bg);
  }
  .hero-inner{
    max-width:820px;
    margin:0 auto;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    color:#fbe9dc;
    background:var(--terracotta-dark);
    padding:5px 12px 5px 10px;
    border-radius:8px;
    margin-bottom:16px;
  }
  .hero h1{
    margin:0 0 8px;
    font-size:clamp(30px,7vw,44px);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:1.05;
  }
  .hero p{
    margin:0;
    font-size:15px;
    color:var(--muted);
    max-width:480px;
    line-height:1.5;
  }
  .hero-stats{
    display:flex;
    gap:10px;
    margin-top:24px;
    flex-wrap:wrap;
  }
  .stat-pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 16px;
    box-shadow:var(--shadow);
    font-size:13px;
  }
  .stat-pill b{display:block;font-size:17px;font-weight:800;letter-spacing:-0.01em;}
  .stat-pill span{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;}

  /* Layout */
  main{
    max-width:820px;
    margin:0 auto;
    padding:0 20px 80px;
    position:relative;
    margin-top:-32px;
  }
  .rail{
    position:relative;
  }
  .rail::before{
    content:'';
    position:absolute;
    left:23px;
    top:var(--line-start, 8px);
    bottom:var(--line-end, 8px);
    width:2px;
    background:var(--terracotta-dark);
    opacity:0.35;
    border-radius:2px;
  }

  .stop{
    position:relative;
    padding-left:60px;
    margin-bottom:16px;
  }
  .dot{
    position:absolute;
    left:12px;
    top:18px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--terracotta-dark);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
    z-index:2;
    box-shadow:0 0 0 4px var(--bg);
  }

  details.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:box-shadow 0.2s ease, transform 0.2s ease;
  }
  details.card[open]{
    box-shadow:var(--shadow-hover);
  }

  summary{
    list-style:none;
    cursor:pointer;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  summary::-webkit-details-marker{display:none;}
  .summary-left{min-width:0;}
  .place-name{
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .date-range{
    font-size:12.5px;
    color:var(--faint);
    margin-top:2px;
    font-weight:500;
  }
  .date-range .dotsep{margin:0 6px;opacity:0.5;}

  .summary-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .weather-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:8px;
    white-space:nowrap;
  }
  .weather-chip.good{background:#fdf0b8;color:#8a6a1a;}
  .weather-chip.bad{background:#dde5ee;color:#51687f;}
  .weather-chip.pending{
    background:#f1e8dd;
    color:var(--faint);
    font-weight:500;
  }
  .chevron{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--muted);
    transition:transform 0.25s ease;
    flex-shrink:0;
  }
  details[open] .chevron{transform:rotate(90deg);}

  .card-body{
    padding:2px 20px 22px;
  }
  .divider{height:1px;background:var(--line);margin:0 0 18px;}

  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--faint);
    font-weight:700;
    margin:20px 0 10px;
  }
  .section-label:first-child{margin-top:0;}

  .weather-detail{
    display:flex;
    gap:16px;
    align-items:center;
    background:var(--bg);
    border-radius:10px;
    padding:14px 16px;
  }
  .weather-detail.good{background:#fdf0b8;}
  .weather-detail.bad{background:#dde5ee;}
  .icon-big{font-size:32px;line-height:1;}
  .temp-max{font-size:24px;font-weight:800;letter-spacing:-0.01em;}
  .temp-min{color:var(--faint);font-size:15px;font-weight:500;}
  .weather-note{
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }

  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    background:var(--terracotta-soft);
    border-radius:10px;
    padding:14px 16px;
  }
  .hotel-name{font-weight:700;font-size:14.5px;}
  .hotel-meta{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4;}
  .hotel-link{
    flex-shrink:0;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background:var(--terracotta);
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    white-space:nowrap;
  }

  .sights{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:8px;
  }
  .sights li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:14px;
    padding:10px 14px;
    background:var(--bg);
    border-radius:8px;
  }
  .sights .rating{
    font-size:11.5px;
    color:var(--sun);
    font-weight:700;
    flex-shrink:0;
  }

  footer{
    text-align:center;
    padding:8px 20px 40px;
    font-size:11.5px;
    color:var(--faint);
  }

  @media (max-width:480px){
    .hero{padding:32px 16px 56px;}
    main{padding:0 12px 60px;}
    .stop{padding-left:52px;}
    .dot{left:6px;}
    .rail::before{left:17px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <span class="eyebrow">🧭 28 aug — 16 sept</span>
    <h1>Roadtrip 2026</h1>
    <p>Groningen tot aan het Gardameer en terug via de Balkan</p>
    <div class="hero-stats">
      <div class="stat-pill"><b>7</b><span>Bestemmingen</span></div>
      <div class="stat-pill"><b>3527</b><span>Kilometer</span></div>
      <div class="stat-pill"><b>20</b><span>Dagen onderweg</span></div>
    </div>
  </div>
</div>

<main>
  <div class="rail" id="stops"></div>
</main>

<footer>Weer via Open-Meteo · verschijnt automatisch zodra een bestemming binnen 15 dagen ligt</footer>

<script>
const stops = [
  {
    name: "Strasbourg",
    country: "Frankrijk",
    dateStart: "2026-08-28",
    dateEnd: "2026-08-31",
    lat: 48.5734, lon: 7.7521,
    hotel: { label: "Hotel", link: "https://www.booking.com/Share-0OJoS9", note: "Parkeren gereserveerd" },
    sights: [
      { n: "Cathédrale Notre-Dame de Strasbourg", r: 4.8 },
      { n: "Place Kléber", r: 4.5 },
      { n: "Barrage Vauban", r: 4.6 },
      { n: "Ponts Couverts", r: 4.7 }
    ]
  },
  {
    name: "Basel",
    country: "Zwitserland",
    dateStart: "2026-08-31",
    dateEnd: "2026-09-02",
    lat: 47.5596, lon: 7.5886,
    hotel: { label: "Appartement", link: "https://www.booking.com/Share-ixAonz", note: "Geboekt via ProtonMail · parkeren aan de weg, nog uitzoeken" },
    sights: [
      { n: "Museum Tinguely", r: null },
      { n: "Basel Cathedral (Münster)", r: 4.6 },
      { n: "Kunstmuseum Basel", r: 4.6 },
      { n: "Spalentor", r: 4.6 }
    ]
  },
  {
    name: "Gardameer",
    country: "Italië",
    dateStart: "2026-09-02",
    dateEnd: "2026-09-04",
    lat: 45.5758, lon: 10.6215,
    hotel: { label: "Hotel", link: "https://www.booking.com/Share-EBNmLE", note: "Parkeren gratis" },
    sights: [
      { n: "Castello Scaligero di Sirmione", r: 4.6 },
      { n: "Vittoriale degli Italiani", r: 4.7 },
      { n: "Grotte di Catullo (Sirmione)", r: 4.5 },
      { n: "Parco Alto Garda Bresciano", r: 4.6 }
    ]
  },
  {
    name: "Zagreb",
    country: "Kroatië",
    dateStart: "2026-09-04",
    dateEnd: "2026-09-07",
    lat: 45.8150, lon: 15.9819,
    hotel: { label: "Appartement", link: "https://www.booking.com/Share-gvfG7Z2", note: "Public parking · dagtrip Podgarić Monument op 5 sept" },
    sights: [
      { n: "Lotrščak Tower", r: 4.7 },
      { n: "Cathedral of Zagreb", r: 4.6 },
      { n: "Museum of Broken Relationships", r: 4.3 },
      { n: "Stone Gate", r: 4.7 },
      { n: "Podgarić Monument (dagtrip)", r: null }
    ]
  },
  {
    name: "Bratislava",
    country: "Slowakije",
    dateStart: "2026-09-07",
    dateEnd: "2026-09-09",
    lat: 48.1486, lon: 17.1077,
    hotel: { label: "Appartement", link: "https://www.booking.com/Share-sUqvtdQ", note: "⚠️ Public parking — check alternatief" },
    sights: [
      { n: "Bratislava Castle", r: 4.5 },
      { n: "Hviezdoslavovo námestie", r: 4.6 },
      { n: "Devín Castle", r: 4.7 },
      { n: "Slavín memorial", r: 4.7 }
    ]
  },
  {
    name: "Linz",
    country: "Oostenrijk",
    dateStart: "2026-09-09",
    dateEnd: "2026-09-12",
    lat: 48.3069, lon: 14.2858,
    hotel: { label: "Hotel", link: "https://www.booking.com/Share-gAn9QaT", note: "Nog reserveren · parkeren gratis · Ars Electronica 10–11 sept" },
    sights: [
      { n: "Ars Electronica Center", r: 4.5 },
      { n: "Linz Hauptplatz", r: 4.6 },
      { n: "Neuer Dom (New Cathedral)", r: 4.7 },
      { n: "Grottenbahn (Pöstlingberg)", r: 4.6 }
    ]
  },
  {
    name: "München",
    country: "Duitsland",
    dateStart: "2026-09-12",
    dateEnd: "2026-09-16",
    lat: 48.1351, lon: 11.5820,
    hotel: { label: "Hotel", link: "https://www.booking.com/Share-phrrFbl", note: "Gärtnerplatzviertel/Glockenbach · Oktoberfest-timing checken" },
    sights: [
      { n: "Marienplatz", r: 4.7 },
      { n: "Englischer Garten", r: 4.7 },
      { n: "Olympiapark", r: 4.7 },
      { n: "Schloss Nymphenburg", r: 4.6 }
    ]
  }
];

const WMO = {
  0:["Helder","☀️"],1:["Overwegend helder","🌤️"],2:["Half bewolkt","⛅"],3:["Bewolkt","☁️"],
  45:["Mist","🌫️"],48:["Rijp/mist","🌫️"],
  51:["Lichte motregen","🌦️"],53:["Motregen","🌦️"],55:["Zware motregen","🌧️"],
  61:["Lichte regen","🌧️"],63:["Regen","🌧️"],65:["Zware regen","🌧️"],
  71:["Lichte sneeuw","🌨️"],73:["Sneeuw","🌨️"],75:["Zware sneeuw","❄️"],
  80:["Buien","🌦️"],81:["Fikse buien","🌧️"],82:["Zware buien","⛈️"],
  95:["Onweer","⛈️"],96:["Onweer met hagel","⛈️"],99:["Zwaar onweer","⛈️"]
};

function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
}

function daysUntil(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dt = new Date(d+"T00:00:00");
  return Math.round((dt-today)/86400000);
}

const GOOD_WEATHER_CODES = new Set([0,1,2,3]);

async function fetchWeather(stop){
  const el = document.getElementById('w-'+stop.name);
  const bodyEl = document.getElementById('wd-'+stop.name);
  const dUntil = daysUntil(stop.dateStart);
  if(dUntil > 15){
    el.classList.add('pending');
    el.innerHTML = `🗓️ nog te ver vooruit`;
    bodyEl.innerHTML = `<div class="weather-detail"><span class="icon-big">🗓️</span><div><div style="font-weight:700;font-size:14.5px;">Nog niet beschikbaar</div><div class="weather-note">Verschijnt zodra we binnen 15 dagen van ${fmtDate(stop.dateStart)} zitten.</div></div></div>`;
    return;
  }
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${stop.dateStart}&end_date=${stop.dateStart}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if(data.error) throw new Error(data.reason || 'API error');
    const code = data.daily.weather_code[0];
    const tmax = Math.round(data.daily.temperature_2m_max[0]);
    const tmin = Math.round(data.daily.temperature_2m_min[0]);
    const [label, icon] = WMO[code] || ["Onbekend","❓"];
    const cond = GOOD_WEATHER_CODES.has(code) ? 'good' : 'bad';
    el.classList.add(cond);
    el.innerHTML = `${icon} ${tmax}° / ${tmin}°`;
    bodyEl.innerHTML = `
      <div class="weather-detail ${cond}">
        <span class="icon-big">${icon}</span>
        <div>
          <div><span class="temp-max">${tmax}°</span> <span class="temp-min">/ ${tmin}°</span></div>
          <div class="weather-note">${label} · verwachting voor ${fmtDate(stop.dateStart)}</div>
        </div>
      </div>`;
  }catch(e){
    el.classList.add('pending');
    el.innerHTML = `⚠️ onbekend`;
    bodyEl.innerHTML = `<div class="weather-note">Kon weersverwachting niet ophalen (${e.message}).</div>`;
  }
}

const container = document.getElementById('stops');
stops.forEach((stop, i) => {
  const div = document.createElement('div');
  div.className = 'stop';
  div.innerHTML = `
    <div class="dot">${i+1}</div>
    <details class="card">
      <summary>
        <div class="summary-left">
          <div class="place-name">${stop.name}</div>
          <div class="date-range">${fmtDate(stop.dateStart)} – ${fmtDate(stop.dateEnd)}<span class="dotsep">·</span>${stop.country}</div>
        </div>
        <div class="summary-right">
          <span class="weather-chip" id="w-${stop.name}">…</span>
          <span class="chevron">▶</span>
        </div>
      </summary>
      <div class="card-body">
        <div class="divider"></div>

        <div class="section-label">Weer</div>
        <div id="wd-${stop.name}"><div class="weather-note">Laden…</div></div>

        <div class="section-label">Hotel</div>
        <div class="hotel-card">
          <div>
            <div class="hotel-name">${stop.hotel.label}</div>
            <div class="hotel-meta">${stop.hotel.note}</div>
          </div>
          <a class="hotel-link" href="${stop.hotel.link}" target="_blank" rel="noopener">Booking</a>
        </div>

        <div class="section-label">Bezienswaardigheden</div>
        <ul class="sights">
          ${stop.sights.map(s => `<li>${s.n}${s.r ? `<span class="rating">★ ${s.r}</span>` : ''}</li>`).join('')}
        </ul>
      </div>
    </details>
  `;
  container.appendChild(div);
  fetchWeather(stop);
});

function updateRailLine(){
  const dots = container.querySelectorAll('.dot');
  if(!dots.length) return;
  const containerRect = container.getBoundingClientRect();
  const firstRect = dots[0].getBoundingClientRect();
  const lastRect = dots[dots.length-1].getBoundingClientRect();
  container.style.setProperty('--line-start', (firstRect.bottom - containerRect.top) + 'px');
  container.style.setProperty('--line-end', (containerRect.bottom - lastRect.top) + 'px');
}
updateRailLine();
container.addEventListener('toggle', updateRailLine, true);
window.addEventListener('resize', updateRailLine);
</script>
</body>
</html>
